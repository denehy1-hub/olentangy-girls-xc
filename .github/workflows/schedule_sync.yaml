name: Sync Schedule Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run ETL Script
        run: python .github/scripts/fetch_schedule.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git pull origin main --rebase || true
          git add assets/data/schedule.json assets/data/schedule.ics
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update schedule data [skip ci]"
          git push