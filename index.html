<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Olentangy Girls Cross Country</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        /* Specific Homepage Overrides for Hero and Footer Layout */
        .hero-section {
            background: linear-gradient(rgba(0, 40, 85, 0.85), rgba(0, 40, 85, 0.85)), url('./assets/img/cover-photo.jpg') no-repeat center center;
            background-size: cover;
            padding: 6rem 2rem 10rem 2rem;
            text-align: center;
            color: #ffffff;
        }
        
        .hero-section h2 {
            font-size: 2.75rem;
            margin: 0 0 1rem 0;
            color: #ffffff;
        }

        .hero-section p {
            max-width: 800px;
            margin: 0 auto 2.5rem auto;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-gold {
            background-color: var(--primary-gold);
            color: var(--primary-navy);
            padding: 0.8rem 1.75rem;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
            display: inline-block;
        }

        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 0.8rem 1.75rem;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s;
            display: inline-block;
        }

        .btn-outline:hover {
            background-color: #ffffff;
            color: var(--primary-navy);
        }

        .btn-gold:hover {
            opacity: 0.9;
        }

        /* Sponsors Section Style */
        .sponsors-section {
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 4rem 2rem;
            text-align: center;
            margin-top: 4rem;
        }
        .sponsors-section h3 {
            color: var(--primary-navy);
            font-size: 1.75rem;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
        }
        .sponsors-img-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .sponsors-img-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body style="background-color: #f1f5f9;">

    <!-- Dynamic Header Injection -->
    <header id="site-header"></header>

    <!-- Full-Width Hero Section -->
    <div class="hero-section">
        <h2>Pacing for Excellence</h2>
        <p>Welcome to the official digital headquarters for Olentangy High School Girls Cross Country. Streamlined navigation, schedules, and resources for athletes, families, and supporters.</p>
        <div class="hero-buttons">
            <a href="schedule.html" class="btn-gold">View 2026 Schedule</a>
            <a href="parents.html" class="btn-outline">Access Parent &amp; Camp Info</a>
        </div>
    </div>

    <!-- Sponsors Showcase Section -->
    <div class="sponsors-section">
        <h3>Thank You To Our Incredible Sponsors</h3>
        <div class="sponsors-img-container">
            <img src="./assets/img/sponsors.jpg" alt="Olentangy Girls XC Sponsors">
        </div>
    </div>

    <!-- Dynamic Footer Injection -->
    <footer class="expanded-footer" id="site-footer"></footer>

    <!-- Central JavaScript file handling dynamic header/footer loading & mobile nav -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
